basePath: /
definitions:
  handler.CreateTaskRequest:
    properties:
      description:
        type: string
      due_at:
        description: 截止时间，RFC3339，例如 2026-12-01T18:00:00+08:00；不传表示不设截止
        type: string
      title:
        type: string
    type: object
  handler.CreateUserRequest:
    properties:
      age:
        type: integer
      gender:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      age:
        type: integer
      gender:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  handler.UpdateTaskRequest:
    properties:
      description:
        type: string
      due_at:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  handler.UpdateUserRequest:
    properties:
      age:
        type: integer
      gender:
        type: string
      name:
        type: string
    type: object
  model.Task:
    properties:
      created_at:
        type: string
      description:
        type: string
      due_at:
        description: 截止时间，为空表示不设截止
        type: string
      id:
        type: integer
      reminded_at:
        description: 超期提醒时间，作为去重标记
        type: string
      status:
        type: string
      title:
        type: string
      user_id:
        type: integer
    type: object
  model.User:
    properties:
      age:
        type: integer
      gender:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 员工-任务管理系统接口文档（JWT 鉴权 + 按角色授权 + 超期提醒）
  title: Task System API
  version: 1.3.1
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: '成功返回 JWT，之后请求头带 Authorization: Bearer <token>'
      parameters:
      - description: 用户名和密码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: 登录并获取 token
      tags:
      - 认证
  /auth/logout:
    post:
      description: token_version +1，该用户所有旧 token 立即失效
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 密码以 bcrypt 哈希存储
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: 注册新用户
      tags:
      - 认证
  /hello:
    get:
      parameters:
      - description: 名字，缺省 Guest
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 打招呼
      tags:
      - 系统
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 健康检查
      tags:
      - 系统
  /tasks/{id}:
    delete:
      parameters:
      - description: 任务ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除任务
      tags:
      - 任务
    put:
      consumes:
      - application/json
      parameters:
      - description: 任务ID
        in: path
        name: id
        required: true
        type: integer
      - description: 任务信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新任务
      tags:
      - 任务
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.User'
            type: array
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 员工列表
      tags:
      - 用户
    post:
      consumes:
      - application/json
      description: 管理员代建账号，密码必填（≥6 位，入库前 bcrypt 哈希）
      parameters:
      - description: 员工信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 该姓名已被注册
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 新增员工（管理员）
      tags:
      - 用户
  /users/{id}:
    delete:
      parameters:
      - description: 员工ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除员工（连同其任务）
      tags:
      - 用户
    get:
      parameters:
      - description: 员工ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询单个员工
      tags:
      - 用户
    put:
      consumes:
      - application/json
      parameters:
      - description: 员工ID
        in: path
        name: id
        required: true
        type: integer
      - description: 员工信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新员工
      tags:
      - 用户
  /users/{id}/tasks:
    get:
      parameters:
      - description: 员工ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Task'
            type: array
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 员工的全部任务
      tags:
      - 任务
    post:
      consumes:
      - application/json
      parameters:
      - description: 员工ID
        in: path
        name: id
        required: true
        type: integer
      - description: 任务信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 给员工创建任务
      tags:
      - 任务
  /users/tasks/{id}:
    get:
      parameters:
      - description: 任务ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Task'
        "403":
          description: 无权访问该员工的数据
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询单个任务
      tags:
      - 任务
securityDefinitions:
  BearerAuth:
    description: 格式：Bearer <token>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
