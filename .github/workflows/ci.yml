name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_DSN: root:root@tcp(127.0.0.1:3306)/task_system?parseTime=true&charset=utf8mb4
      TEST_DB_DSN: root:root@tcp(127.0.0.1:3306)/task_system_test?parseTime=true&charset=utf8mb4
      SERVICE_TEST_DB_DSN: root:root@tcp(127.0.0.1:3306)/task_system_service_test?parseTime=true&charset=utf8mb4
      JWT_SECRET: ci-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 初始化数据库
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < schema.sql

      - name: 格式检查
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        run: go build ./...

      - name: 测试（含数据竞争检测）
        run: go test ./... -race -count=1
